name: radar

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min, off the top of the hour to reduce GitHub delays
  workflow_dispatch: {}

concurrency:
  group: radar-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore radar state
        uses: actions/cache/restore@v6
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-db-
      - name: Run radar
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GHOST_SHEET_ID: ${{ secrets.GHOST_SHEET_ID }}
          RADAR_SA_JSON: ${{ secrets.RADAR_SA_JSON }}
        # Until the email secrets exist, keep building history without sending (and without failing).
        run: |
          if [ -z "$SMTP_USER" ]; then
            echo "::warning::Email secrets are not set yet; running in dry-run mode, no emails sent."
            python -m radar run --dry-run
          else
            python -m radar run
          fi
      - name: Save radar state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}
