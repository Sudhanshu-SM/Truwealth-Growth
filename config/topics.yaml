# The topics the radar scores: the finance topics first, then a few for every other genre. Matching rules (spec
# section 8):
# - keywords match whole words, case-insensitively;
# - ALL-CAPS keywords of 4 characters or fewer (SIP, UPI, F&O) match case-sensitively;
# - Devanagari keywords match as substrings.
# angles must be ids from angles.yaml, in order of preference.
# genres are ids from genres.yaml, most relevant first. A topic with a finance genre is a finance topic: it names one
# of the four finance buckets, and only finance topics reach the Sheet, the HOT emails and the digest. Every other
# topic has no bucket (its bucket is its first genre), no finance genre, and lists its own genre first, because the
# per-genre daily cap counts a topic's first genre.

